<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TickTockFocus</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="app">
      <section class="screen" data-screen="main">
        <header class="app-header">
          <div class="tab-list" role="tablist" data-ui-label="navigation.sections">
            <button type="button" class="tab" role="tab" id="tab_timer" data-tab="timer" aria-controls="panel_timer" aria-selected="true" data-ui-text="navigation.timerTab"></button>
            <button type="button" class="tab" role="tab" id="tab_routines" data-tab="routines" aria-controls="panel_routines" aria-selected="false" tabindex="-1" data-ui-text="navigation.routinesTab"></button>
          </div>
          <button type="button" class="icon-button" id="open_settings" data-ui-label="navigation.settings">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.14 12.94a7.07 7.07 0 0 0 .05-.94 7.07 7.07 0 0 0-.05-.94l2.03-1.58a.49.49 0 0 0 .12-.62l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54A.48.48 0 0 0 13.92 2h-3.84a.48.48 0 0 0-.48.41l-.36 2.54a7.37 7.37 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.72 8.47a.48.48 0 0 0 .12.62l2.03 1.58a7.07 7.07 0 0 0-.05.94c0 .32.02.63.05.94l-2.03 1.58a.49.49 0 0 0-.12.62l1.92 3.32c.12.22.38.3.59.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.05.24.25.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54a7.37 7.37 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.62l-2.03-1.58ZM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2Z"/></svg>
          </button>
        </header>
        <div class="tab-panel" id="panel_timer" data-tab="timer" role="tabpanel" aria-labelledby="tab_timer">
          <div class="notice whats-new" id="whats_new">
            <p class="whats-new-text" id="whats_new_text" role="status"></p>
            <a class="notice-link" id="whats_new_link" href="../welcome/welcome.html#how-it-works" target="_blank" rel="noopener noreferrer" hidden><span data-ui-text="whatsNew.seeHowItWorks"></span><span class="external-mark" aria-hidden="true">↗</span><span class="visually-hidden" data-ui-text="settings.opensInNewTab"></span></a>
            <button type="button" class="icon-button notice-close" id="whats_new_close" data-ui-label="whatsNew.close" hidden></button>
          </div>
          <div class="timer-idle" id="timer_idle">
            <p class="panel-message" id="timer_idle_message" aria-live="polite"></p>
            <ul class="routine-cards" id="routine_cards"></ul>
            <button type="button" class="text-button" id="timer_new_routine"></button>
            <div class="empty-state" id="timer_empty_state" hidden>
              <p class="empty-state-title" data-ui-text="timer.noRoutines"></p>
              <p class="empty-state-text" id="template_cards_intro" data-ui-text="timer.templatesIntro"></p>
              <ul class="template-cards" id="template_cards" aria-labelledby="template_cards_intro"></ul>
              <button type="button" class="text-button" id="timer_build_own" data-ui-text="timer.buildYourOwn"></button>
            </div>
          </div>
          <div class="timer-run" id="timer_run" hidden>
            <h2 class="run-routine-name" id="run_routine_name"></h2>
            <p class="run-stage-line" id="run_stage_line" aria-live="polite" aria-atomic="true"></p>
            <div class="run-ring" id="run_ring">
              <p class="run-countdown" id="run_countdown" role="timer"></p>
            </div>
            <p class="run-next" id="run_next"></p>
            <p class="run-ends" id="run_ends"></p>
            <div class="run-controls">
              <button type="button" class="button button-primary" id="run_primary"></button>
              <button type="button" class="button" id="run_skip"></button>
              <button type="button" class="button" id="run_extend"></button>
            </div>
            <button type="button" class="button button-quiet" id="run_stop"></button>
            <p class="form-message error" id="run_message" aria-live="polite"></p>
          </div>
        </div>
        <div class="tab-panel" id="panel_routines" data-tab="routines" role="tabpanel" aria-labelledby="tab_routines" hidden>
          <p class="panel-message" id="routines_message" aria-live="polite"></p>
          <ul class="routine-list" id="routine_list"></ul>
          <p class="empty-state-title routines-empty" id="routines_empty" data-ui-text="routines.empty" hidden></p>
          <button type="button" class="text-button" id="routines_new_routine"></button>
        </div>
      </section>

      <section class="screen" data-screen="editor" aria-labelledby="editor_heading" hidden>
        <header class="screen-header">
          <button type="button" class="icon-button" data-back data-ui-label="navigation.back"><span class="back-arrow" aria-hidden="true">←</span></button>
          <h1 class="screen-heading" id="editor_heading" tabindex="-1" data-screen-heading></h1>
        </header>
        <form class="screen-body editor-form" id="editor_form" novalidate>
          <p class="editor-note" id="editor_running_note" data-ui-text="editor.runningNote" hidden></p>
          <p class="editor-note is-warning" id="editor_limit_note" hidden></p>
          <div class="form-field">
            <label class="input-label" for="editor_name" data-ui-text="editor.name"></label>
            <input type="text" class="input" id="editor_name" autocomplete="off" aria-describedby="editor_name_error">
            <p class="field-error" id="editor_name_error"></p>
          </div>
          <ol class="editor-blocks" id="editor_blocks" data-ui-label="editor.stepsLabel"></ol>
          <div class="editor-add-buttons">
            <button type="button" class="text-button" id="editor_add_stage"></button>
            <button type="button" class="text-button" id="editor_add_group"></button>
          </div>
          <p class="field-error" id="editor_routine_error" tabindex="-1"></p>
          <p class="visually-hidden" id="editor_status" aria-live="polite"></p>
        </form>
        <footer class="editor-footer">
          <p class="editor-total" id="editor_total"></p>
          <div class="editor-discard" id="editor_discard" role="group" aria-labelledby="editor_discard_text" hidden>
            <p id="editor_discard_text" data-ui-text="editor.discardQuestion"></p>
            <div class="editor-actions">
              <button type="button" class="button button-secondary" id="editor_discard_confirm" data-ui-text="editor.discard"></button>
              <button type="button" class="button button-primary" id="editor_keep_editing" data-ui-text="editor.keepEditing"></button>
            </div>
          </div>
          <div class="editor-actions">
            <button type="button" class="button button-secondary" id="editor_cancel" data-ui-text="editor.cancel"></button>
            <button type="button" class="button button-primary" id="editor_save" data-ui-text="editor.save"></button>
          </div>
        </footer>
      </section>

      <section class="screen" data-screen="settings" aria-labelledby="settings_heading" hidden>
        <header class="screen-header">
          <button type="button" class="icon-button" data-back data-ui-label="navigation.back"><span class="back-arrow" aria-hidden="true">←</span></button>
          <h1 class="screen-heading" id="settings_heading" tabindex="-1" data-screen-heading data-ui-text="settings.heading"></h1>
        </header>
        <div class="screen-body settings-body">
          <fieldset class="settings-group">
            <legend data-ui-text="settings.nextStep"></legend>
            <label class="radio-option"><input type="radio" name="next_step" value="auto"><span data-ui-text="settings.startAutomatically"></span></label>
            <label class="radio-option"><input type="radio" name="next_step" value="wait"><span data-ui-text="settings.waitForMe"></span></label>
          </fieldset>
          <fieldset class="settings-group">
            <legend data-ui-text="settings.timeFormat"></legend>
            <label class="radio-option"><input type="radio" name="time_format" value="24h"><span data-ui-text="settings.hours24"></span></label>
            <label class="radio-option"><input type="radio" name="time_format" value="12h"><span data-ui-text="settings.hours12"></span></label>
          </fieldset>
          <fieldset class="settings-group">
            <legend data-ui-text="settings.sound"></legend>
            <label class="switch-option"><input type="checkbox" class="switch" role="switch" id="sound_enabled"><span data-ui-text="settings.playSound"></span></label>
            <div class="setting-row">
              <label class="setting-label" for="sound_id" data-ui-text="settings.tone"></label>
              <select class="input setting-select" id="sound_id"></select>
              <button type="button" class="button button-secondary setting-test" id="sound_test"></button>
            </div>
            <div class="setting-row">
              <label class="setting-label" for="sound_volume" data-ui-text="settings.volume"></label>
              <input type="range" class="volume-slider" id="sound_volume" min="0" max="100" step="5">
              <span class="volume-value" id="sound_volume_value" aria-hidden="true"></span>
            </div>
          </fieldset>
          <fieldset class="settings-group">
            <legend data-ui-text="settings.timeOnIcon"></legend>
            <label class="switch-option"><input type="checkbox" class="switch" role="switch" id="show_badge"><span data-ui-text="settings.showTimeOnIcon"></span></label>
          </fieldset>
          <p class="panel-message" id="settings_message" aria-live="polite"></p>
          <nav class="settings-links" data-ui-label="settings.linksLabel">
            <a href="../welcome/welcome.html#how-it-works" target="_blank" rel="noopener noreferrer"><span data-ui-text="settings.howItWorks"></span><span class="external-mark" aria-hidden="true">↗</span><span class="visually-hidden" data-ui-text="settings.opensInNewTab"></span></a>
            <a href="https://ticktockfocus.com" target="_blank" rel="noopener noreferrer"><span data-ui-text="settings.website"></span><span class="external-mark" aria-hidden="true">↗</span><span class="visually-hidden" data-ui-text="settings.opensInNewTab"></span></a>
            <a href="mailto:support@ticktockfocus.com?subject=TickTockFocus%20feedback" target="_blank" rel="noopener noreferrer"><span data-ui-text="settings.sendFeedback"></span><span class="external-mark" aria-hidden="true">↗</span><span class="visually-hidden" data-ui-text="settings.opensInNewTab"></span></a>
            <a href="https://chromewebstore.google.com/detail/nealkefeifpkmkbfcfbkffdgnlohjbae/reviews" target="_blank" rel="noopener noreferrer"><span data-ui-text="settings.rate"></span><span class="external-mark" aria-hidden="true">↗</span><span class="visually-hidden" data-ui-text="settings.opensInNewTab"></span></a>
            <a href="https://github.com/mist941/tick-tock-focus/issues" target="_blank" rel="noopener noreferrer"><span data-ui-text="settings.reportBug"></span><span class="external-mark" aria-hidden="true">↗</span><span class="visually-hidden" data-ui-text="settings.opensInNewTab"></span></a>
          </nav>
          <p class="settings-version" id="settings_version"></p>
        </div>
      </section>
      <div class="toast" id="toast" role="status"></div>
    </div>
    <script type="module" src="popup.js"></script>
</body>
</html>
